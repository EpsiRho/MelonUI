name: Build and Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The demo and shaders need Windows, so other systems only build the library and tests.
      - name: Pick what to build
        shell: pwsh
        run: |
          $target = if ($IsWindows) { 'MelonUIDemo.sln' } else { 'MelonUI.slnf' }
          "TARGET=$target" | Out-File $env:GITHUB_ENV -Append
      - run: dotnet build ${{ env.TARGET }} -c Release --warnaserror
      - run: dotnet run --project MelonUI.Tests -c Release --no-build -- --soak
